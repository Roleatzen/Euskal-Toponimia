<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euskal Toponimia Generator</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>GENERADOR DE TOPONIMIA VASCA</small><h1>Euskal Toponimia Generator</h1><p>Generador experimental de topónimos vascos, históricos y protovascos.</p></header><section class="panel"><label>Modo</label><select id="mode"><option value="documental">Documental</option><option value="vasco" selected>Vasco</option><option value="historico">Histórico</option><option value="proto">Proto — experimental</option></select><div class="row"><label>Cantidad</label><input id="amount" type="number" min="1" max="100" value="1"></div><button id="generate">🎲 Generar topónimo</button></section><section id="results"></section><section class="panel"><h2>Sobre el generador</h2><p>El resultado es una construcción generativa y no implica que exista como topónimo histórico documentado.</p><p id="count"></p></section></main><script src="app.js"></script></body></html>
